[workspace]
members = [
    "crates/sol-ast",
    "crates/semantic",
    "crates/patterns",
    "crates/knowledge",
    "crates/knowdit-client",
    "crates/spec-gen",
    "crates/harness-synth",
    "crates/fuzz-exec",
    "crates/reflector",
    "crates/agent-core",
    "crates/agent-llm",
    "crates/orchestrator",
    "crates/verifier",
    "crates/benchmark",
    "crates/etherscan-fetcher",
    "crates/cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
petgraph = "0.7"
regex = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

solang-parser = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
